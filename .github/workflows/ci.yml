name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in the
    # stack, and a filter of [main] silently gives every layer but the bottom
    # one zero checks — a green PR with nothing run looks identical to a
    # passing one.
    branches: [main, "claude/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The console ships as WASM, so this target is the one that matters —
          # code can pass a native `cargo check` and fail to compile for the
          # browser.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # Covers the API client's decoding, including `tests/live_shapes.rs`,
      # which decodes CAPTURED LIVE responses with the production types. That is
      # a different claim from the unit tests: those decode fixtures this repo
      # wrote, and the Svelte client this replaces had types that were
      # self-consistent and wrong.
      - run: cargo test

      - run: cargo check --target wasm32-unknown-unknown --all-targets

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # `astro check` typechecks the pages and their frontmatter. The build is
      # the one that proves the two toolchains compose: the island script
      # references a bundle name derived from the CRATE name, so a rename that
      # updates one and not the other is a build failure here rather than a
      # blank page in production.
      - run: pnpm exec astro check

      - run: pnpm exec astro build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The gitleaks/gitleaks-action wrapper requires a paid licence for org
      # repos. The binary is MIT-licensed, so it runs directly and stays free.
      - name: Install gitleaks
        env:
          VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - run: gitleaks detect --source . --redact --no-banner --verbose
